[package]
name = "pizza-analysis-ik"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/pizza-rs/analysis-ik"
categories = ["text-processing"]
keywords = ["pizza", "ik", "chinese", "tokenizer", "search"]
authors = ["INFINI Labs Team",]
license = "Apache-2.0"
description = "IK Chinese segmentation plugin for INFINI Pizza"
build = "build.rs"


[features]
default = ["main-dict", "embed", "embed-fallback"]
# Embed the raw `*.dic` text as a runtime fallback (used in no-embed builds).
# Disable for a smaller binary that loads only from config/analysis/ik/.
embed-fallback = []
# Bundle the full ~275K-entry `main.dic` (the standard IK main dictionary).
# Disable to ship a minimal binary that only relies on user-supplied
# extension words.
main-dict = []
# Bake the dictionaries into the binary at build time (fastest, self-contained).
# Disable to load `*.dic` at runtime from the external `config/analysis/ik/`
# directory (editable), with the embedded raw text as a fallback.
embed = []
std = ["pizza-engine/std"]

[dependencies]
pizza-common = { path = "../../lib/common" }
pizza-engine = { path = "../../lib/engine", default-features = false }
hashbrown = { version = "0.14", default-features = false }

[dev-dependencies]
